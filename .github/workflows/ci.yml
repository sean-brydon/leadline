name: ci

# Pull requests are checked; a push to main was checked as its pull request.
# Run it on any branch by hand from the Actions tab. The release workflow
# runs all of it on the commit it is about to release.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request cancels the run still going for the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The daemon and the command line. DuckDB comes as a prebuilt static
  # library that cgo links in, so this needs gcc and g++ (and the race
  # detector needs cgo too): the Ubuntu runners have both.
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: shellcheck scripts/*.sh scripts/release-test/*.sh scripts/release-test/standins/*
      # The four places the version is written say the same.
      - run: scripts/version.sh
      # The scripts that handle a release's credentials, against stand-ins
      # for 1Password and GitHub: what they set, that a value only ever
      # travels on standard input, and that each way of failing says so and
      # sets nothing.
      - run: scripts/release-test/credentials_test.sh
      # The installer's own logic, on a made-up release: it checks before it
      # installs, upgrades, uninstalls, and does nothing when cut short.
      # In dash and in bash, since `curl | sh` meets either.
      - run: scripts/install_test.sh
      - run: SH=bash scripts/install_test.sh

  # @leadline/node, the provider a Node.js app loads. Its tests start real
  # Node processes with the provider in them, against a stand-in daemon.
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/node/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: packages/node
      - run: pnpm test
        working-directory: packages/node

  # The desktop app, on a Mac: that is what it is bundled for, and there
  # Tauri needs nothing installed (the webview is the system's). It builds
  # the daemon the app carries with the Mac's own clang, and the Rust tests
  # start and stop that daemon for real.
  app:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      # The runner's Rust may be older than Cargo.toml's rust-version.
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app/src-tauri
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm test
        working-directory: app
      - run: pnpm build
        working-directory: app
      # cargo needs the sidecar to exist, even to check.
      - run: pnpm sidecar
        working-directory: app
      - run: cargo check --locked
        working-directory: app/src-tauri
      - run: cargo test --locked
        working-directory: app/src-tauri
